# cargo-deny configuration — supply-chain SAST for the quality gate.
#
# Checks: known vulnerabilities (RustSec), license compatibility, banned or
# duplicated crates, and untrusted sources.

[graph]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]
all-features = true

# ── Vulnerabilities ────────────────────────────────────────────────────────────
[advisories]
version = 2
# Unmaintained crates are a real risk for a long-lived project, but they are not
# an emergency the way an active vulnerability is. Both still fail the gate;
# suppressions belong here with a dated justification, never as a silent skip.
ignore = [
    # Example of the required shape — every entry MUST carry a reason and a date:
    # { id = "RUSTSEC-0000-0000", reason = "no fix available; not reachable from our code paths (checked 2026-08-11)" },
]

# ── Licenses ───────────────────────────────────────────────────────────────────
# The client ships to players. A copyleft dependency reaching the binary is a
# distribution problem, so the allowlist is explicit rather than a denylist.
[licenses]
version = 2
confidence-threshold = 0.9
# The allowlist is forward-looking: it names licenses we accept, not licenses we
# currently have. Warning about entries the graph has not reached yet is noise
# that trains people to ignore this stage's output.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "MPL-2.0",          # file-level copyleft; safe as an unmodified dependency
    "Unlicense",
    "OpenSSL",
]

# No per-crate exceptions yet. Add them here only when a crate's license is
# acceptable for a reason that does not generalise — an exception is a decision
# about one dependency, not a hole in the allowlist.

# ── Bans ───────────────────────────────────────────────────────────────────────
[bans]
multiple-versions = "warn"     # common and mostly benign in a large graph
wildcards = "deny"             # a wildcard version is an unpinned dependency
highlight = "all"
deny = [
    # Prefer the maintained successors; these have known soundness or
    # maintenance problems and should never enter the graph silently.
    { name = "openssl", reason = "use rustls — quinn already requires it, and a second TLS stack is a liability" },
    { name = "time", version = "<0.3", reason = "RUSTSEC-2020-0071 segfault in older time" },
]
skip-tree = []

# ── Sources ────────────────────────────────────────────────────────────────────
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
