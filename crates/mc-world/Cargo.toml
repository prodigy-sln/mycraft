[package]
name = "mc-world"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
mc-core = { workspace = true }
# Confined to src/content/, which is the only place a block declaration is read.
# **`mlua` must never appear in this manifest.** The scripting host is the port
# and this crate names only its types — `ScriptHost`, `ScriptValue`,
# `ScriptTable`, `ScriptFault`, `FaultKind`, `HostLimits` — so the blast radius
# of replacing the VM stays inside mc-script. Rust's extern-crate rules are what
# make that structural rather than a rule somebody remembers.
mc-script = { workspace = true }
# Confined to src/content/. The dependency-graph invariant asserts mechanically
# that this never reaches mc-core, because MVP 2 replaces the format wholesale.
toml = { workspace = true }
serde = { workspace = true }
# The save format's encoder, confined to src/persistence/: `postcard::` is
# nameable nowhere else, and every error it raises is translated at that module's
# edge. A **major upgrade is a format-version decision**, not a routine bump —
# it would change both the bytes a save is made of and every definition hash
# stored inside one. See the note at the workspace dependency.
postcard = { workspace = true }
# Section storage is the first thing in this crate to refuse anything of its
# own; until now every failure it reported belonged to mc-core.
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# The write path is asserted over arbitrary sequences of writes, not over a
# handful of chosen ones: the widths a section steps through are what the
# generated cases are there to cross.
proptest = { workspace = true }
# The dependency-graph invariant asks cargo itself what it resolved, and reads
# the answer as JSON.
serde_json = { workspace = true }
# The 200 µs meshing budget is a measurement, not an opinion. Bench-target only:
# `cargo nextest` neither runs nor builds a `harness = false` bench, which is what
# keeps a wall-clock number out of the deterministic gate.
criterion = { workspace = true }

# `harness = false`: the target owns its own `main`, so the budget verdict can be
# an exit code rather than a line of output somebody has to read.
[[bench]]
name = "meshing"
harness = false

[lints]
workspace = true
