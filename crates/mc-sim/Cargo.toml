[package]
name = "mc-sim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Block names, solidity and the registry the replay world is written against.
mc-core = { workspace = true }
# Columns, sections and the mesher. The replay is a world, and a world is what
# this crate stores; the quad -> vertex conversion belongs to the renderer and
# is deliberately absent from this graph.
mc-world = { workspace = true }
# Positions and velocities are vectors, and writing the arithmetic out by axis
# is how a sign error hides. An in-process pure library, deliberately not behind
# a port (architecture-principles §3).
glam = { workspace = true }
# Meshing runs on workers during preparation and never on a frame path, which is
# what FR-6.3-S3's scan of the renderer's source asserts and FR-6.3-S4's scan of
# this crate's source controls.
rayon = { workspace = true }
# Publication swaps a pointer rather than waiting on whoever is reading. A lock
# would satisfy the same scenario only by the discipline of dropping the guard
# immediately, and nothing enforces a discipline.
arc-swap = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# A save is a real file, and the launch decision branches on whether one is
# there. A mocked filesystem would assert nothing about the branch that matters.
tempfile = { workspace = true }

[lints]
workspace = true
